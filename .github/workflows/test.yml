name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: yarn install --ignore-scripts
      - run: yarn test
      # `dist/` is committed and is what every consumer installs, so a stale one ships silently.
      - run: yarn build
      - run: git diff --exit-code dist
